name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Vite
        run: npx electron-vite build

      - name: Build and Publish Installer
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if ("${{ github.ref }}" -like "refs/tags/*") {
            npx electron-builder --win --publish always --config electron-builder.yml
          } else {
            npx electron-builder --win --publish never --config electron-builder.yml
          }
        shell: pwsh